name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc -b then vite build (see package.json) — catches type errors and
      # anything that breaks the production bundle. No separate lint step:
      # this project has no lint tooling configured.
      - name: Typecheck and build
        run: npm run build

      # Not a deploy step — Vercel already builds and deploys this repo on
      # every push to main independently of this workflow. This job exists
      # so a broken PR fails loudly here too, before it ever reaches Vercel.
